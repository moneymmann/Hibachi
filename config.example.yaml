exchange:
  venue: hibachi
  environment: production
  symbol: BTC/USDT-P
  api_endpoint: https://api.hibachi.xyz
  data_api_endpoint: https://data-api.hibachi.xyz
  api_endpoint_env: HIBACHI_API_ENDPOINT_PRODUCTION
  data_api_endpoint_env: HIBACHI_DATA_API_ENDPOINT_PRODUCTION
  api_key_env: HIBACHI_API_KEY_PRODUCTION
  account_id_env: HIBACHI_ACCOUNT_ID_PRODUCTION
  private_key_env: HIBACHI_PRIVATE_KEY_PRODUCTION
  public_key_env: HIBACHI_PUBLIC_KEY_PRODUCTION
  dedicated_subaccount_confirmed: false
  allow_unknown_open_orders: false

strategy:
  mode: adaptive_market_making
  sizing_mode: equity_percent_margin
  entry_margin_pct: "2.0"
  max_order_margin_pct: "5.0"
  max_total_leverage: "1.5"
  max_order_notional_usdt: "1000"
  min_net_edge_bps: "1.5"
  edge_size_ramp_bps: "4.0"
  max_edge_size_multiplier: "3.5"
  top_depth_levels_for_cap: 3
  top_liquidity_participation_pct: "20.0"
  target_position_notional_pct: "0.0"
  position_skew_strength: "2.0"
  min_side_size_multiplier: "0.10"
  max_side_size_multiplier: "2.50"
  latency_buffer_bps: "0.8"
  adverse_selection_buffer_bps: "2.0"
  funding_buffer_bps: "0.7"
  mark_deviation_buffer_bps: "0.7"
  volatility_buffer_min_bps: "0.5"
  volatility_buffer_max_bps: "8.0"
  quote_interval_ms: 400
  quote_ttl_ms: 2500
  min_reprice_ticks: 1
  creation_deadline_sec: 2
  use_inside_quote: true
  use_post_only: true
  cancel_on_edge_loss: true

inventory:
  max_net_position_notional_pct: "40.0"
  inventory_resolution_threshold_pct: "20.0"
  maker_rebalance_grace_ms: 1200
  adverse_move_soft_bps: "4.0"
  adverse_move_hard_bps: "8.0"
  flat_position_threshold_pct: "3.0"

exit_policy:
  maker_entry_only: true
  emergency_taker_exit: true
  passive_reduce_only_alo: true
  passive_exit_timeout_ms: 1200
  aggressive_reduce_only_limit: true
  aggressive_limit_slippage_bps: "2.5"
  aggressive_exit_timeout_ms: 800
  emergency_reduce_only_ioc: true
  emergency_market_close: true
  emergency_trigger_adverse_bps: "10.0"
  emergency_trigger_drawdown_pct: "1.2"
  emergency_trigger_free_margin_pct: "12.0"
  emergency_trigger_liquidation_risk_pct: "60.0"
  max_emergency_exit_slippage_bps: "35.0"

risk:
  max_daily_loss_usdt: "25"
  max_equity_drawdown_pct: "4.0"
  min_free_margin_pct: "18.0"
  max_stale_market_data_ms: 1800
  max_ws_silence_ms: 4000
  max_order_ack_ms: 1000
  max_cancel_ack_ms: 1000
  max_1s_mid_move_bps: "8.0"
  max_5s_mid_move_bps: "18.0"
  max_spread_bps_for_normal_mode: "60.0"
  min_depth_usdt_for_quote: "5000"
  funding_blackout_before_sec: 180
  funding_blackout_after_sec: 30
  max_abs_predicted_funding_bps: "5.0"
  cancel_bot_orders_on_shutdown: true
  cancel_bot_orders_on_stale_data: true
  cancel_bot_orders_on_edge_loss: true
  cancel_bot_orders_on_daily_loss: true

state:
  sqlite_path: ./state/hibachi_bot.sqlite

logging:
  audit_log_path: ./logs/audit.jsonl
