exchange:
  venue: hibachi
  environment: production
  symbol: BTC/USDT-P
  dedicated_subaccount_confirmed: false
  allow_unknown_open_orders: false
strategy:
  sizing_mode: equity_percent_margin
  entry_margin_pct: "1.0"
  max_order_margin_pct: "3.0"
  max_total_leverage: "1.0"
  max_order_notional_usdt: "999999"
  min_net_edge_bps: "1.5"
  edge_size_ramp_bps: "4.0"
  max_edge_size_multiplier: "3.0"
  top_depth_levels_for_cap: 3
  top_liquidity_participation_pct: "20.0"
  target_position_notional_pct: "0.0"
  position_skew_strength: "2.0"
  min_side_size_multiplier: "0.10"
  max_side_size_multiplier: "2.50"
  latency_buffer_bps: "0.8"
  adverse_selection_buffer_bps: "2.0"
  funding_buffer_bps: "0.7"
  mark_deviation_buffer_bps: "0.7"
  quote_interval_ms: 500
  quote_ttl_ms: 2500
  min_reprice_ticks: 1
  use_post_only: true
  use_inside_quote: true
exit_policy:
  maker_entry_only: true
  emergency_taker_exit: true
  passive_reduce_only_alo: true
  aggressive_reduce_only_limit: true
  emergency_reduce_only_ioc: true
  emergency_market_close: true
  maker_rebalance_grace_ms: 1200
  adverse_move_soft_bps: "4.0"
  adverse_move_hard_bps: "8.0"
risk:
  max_daily_loss_usdt: "10"
  max_equity_drawdown_pct: "2.0"
  max_net_position_notional_pct: "40.0"
  min_free_margin_pct: "25.0"
  max_stale_market_data_ms: 2500
  max_ws_silence_ms: 5000
  max_1s_mid_move_bps: "8.0"
  max_5s_mid_move_bps: "18.0"
  min_depth_usdt_for_quote: "1000"
state:
  sqlite_path: ./state/hibachi_bot.sqlite
logging:
  audit_log_path: ./logs/audit.jsonl
